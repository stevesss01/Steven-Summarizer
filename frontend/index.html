<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steven-Summarizer · AI Document Intelligence</title>
    <meta
      name="description"
      content="Upload a PDF and get a structured AI analysis in seconds: executive briefs, resume reviews and research paper breakdowns."
    />
    <meta name="theme-color" content="#0b1120" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Boot splash: shown while the JS bundle loads, removed in main.tsx -->
    <style>
      #boot-splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center;
        background: #0b1120;
        transition: opacity 0.6s ease;
      }
      #boot-splash.is-hidden { opacity: 0; pointer-events: none; }
      .boot-mark {
        width: 56px; height: 56px; border-radius: 16px;
        display: grid; place-items: center;
        font: 700 26px/1 Inter, system-ui, sans-serif; color: #fff;
        background: linear-gradient(135deg, #3b82f6, #22d3ee);
        animation: boot-breathe 2.4s ease-in-out infinite;
      }
      .boot-bar {
        width: 120px; height: 3px; margin: 22px auto 0; border-radius: 99px;
        background: rgba(148, 163, 184, 0.15); overflow: hidden;
      }
      .boot-bar::after {
        content: ""; display: block; width: 40%; height: 100%; border-radius: inherit;
        background: linear-gradient(90deg, transparent, #38bdf8, transparent);
        animation: boot-slide 1.6s ease-in-out infinite;
      }
      @keyframes boot-breathe {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.35); }
        50% { transform: scale(1.06); box-shadow: 0 0 0 14px rgba(56, 189, 248, 0); }
      }
      @keyframes boot-slide { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark, .boot-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash" aria-hidden="true">
      <div>
        <div class="boot-mark">S</div>
        <div class="boot-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
